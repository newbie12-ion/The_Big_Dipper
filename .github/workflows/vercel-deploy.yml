name: Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploy source directly to the project ID. This avoids the separate
      # `vercel pull` link-resolution step, which was returning "Project not found".
      - name: Deploy preview
        run: >-
          vercel deploy --yes
          --token="${VERCEL_TOKEN}"
          --project="${VERCEL_PROJECT_ID}"
          --build-env "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
          --build-env "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production
        run: >-
          vercel deploy --yes --prod
          --token="${VERCEL_TOKEN}"
          --project="${VERCEL_PROJECT_ID}"
          --build-env "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
          --build-env "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
